<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>📂 lsget</title>

    <!-- No-JS fallback: redirect to plain HTML version -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=?nojs=1" />
    </noscript>

    <script nonce="{{CSP_NONCE}}" src="{{SHELL_ASSET_PATH}}marked.min.js"></script>
    <script nonce="{{CSP_NONCE}}" type="module" src="{{SHELL_ASSET_PATH}}terminal.js"></script>
    <script nonce="{{CSP_NONCE}}" type="module" src="{{SHELL_ASSET_PATH}}datastar.js"></script>

    <style nonce="{{CSP_NONCE}}">
      :root {
        /* Catppuccin Frappe theme for terminal */
        --ctp-frappe-rosewater: #f2d5cf;
        --ctp-frappe-flamingo: #eebebe;
        --ctp-frappe-pink: #f4b8e4;
        --ctp-frappe-mauve: #ca9ee6;
        --ctp-frappe-red: #e78284;
        --ctp-frappe-maroon: #ea999c;
        --ctp-frappe-peach: #ef9f76;
        --ctp-frappe-yellow: #e5c890;
        --ctp-frappe-green: #a6d189;
        --ctp-frappe-teal: #81c8be;
        --ctp-frappe-sky: #99d1db;
        --ctp-frappe-sapphire: #85c1dc;
        --ctp-frappe-blue: #8caaee;
        --ctp-frappe-lavender: #babbf1;
        --ctp-frappe-text: #c6d0f5;
        --ctp-frappe-subtext1: #b5bfe2;
        --ctp-frappe-subtext0: #a5adce;
        --ctp-frappe-overlay2: #949cbb;
        --ctp-frappe-overlay1: #838ba7;
        --ctp-frappe-overlay0: #737994;
        --ctp-frappe-surface2: #626880;
        --ctp-frappe-surface1: #51576d;
        --ctp-frappe-surface0: #414559;
        --ctp-frappe-base: #303446;
        --ctp-frappe-mantle: #292c3c;
        --ctp-frappe-crust: #232634;

        /* Terminal colors using Frappe */
        --olivetti: var(--ctp-frappe-green);
        --term-bg: var(--ctp-frappe-base);
        --term-text: var(--ctp-frappe-text);
        --term-border: var(--ctp-frappe-surface2);

        /* Catppuccin Latte theme for README */
        --ctp-latte-rosewater: #dc8a78;
        --ctp-latte-flamingo: #dd7878;
        --ctp-latte-pink: #ea76cb;
        --ctp-latte-mauve: #8839ef;
        --ctp-latte-red: #d20f39;
        --ctp-latte-maroon: #e64553;
        --ctp-latte-peach: #fe640b;
        --ctp-latte-yellow: #df8e1d;
        --ctp-latte-green: #40a02b;
        --ctp-latte-teal: #179299;
        --ctp-latte-sky: #04a5e5;
        --ctp-latte-sapphire: #209fb5;
        --ctp-latte-blue: #1e66f5;
        --ctp-latte-lavender: #7287fd;
        --ctp-latte-text: #4c4f69;
        --ctp-latte-subtext1: #5c5f77;
        --ctp-latte-subtext0: #6c6f85;
        --ctp-latte-overlay2: #7c7f93;
        --ctp-latte-overlay1: #8c8fa1;
        --ctp-latte-overlay0: #9ca0b0;
        --ctp-latte-surface2: #acb0be;
        --ctp-latte-surface1: #bcc0cc;
        --ctp-latte-surface0: #ccd0da;
        --ctp-latte-base: #eff1f5;
        --ctp-latte-mantle: #e6e9ef;
        --ctp-latte-crust: #dce0e8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--term-bg);
        color: var(--term-text);
        font:
          1rem/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "DejaVu Sans Mono",
          monospace;
      }
      .layout {
        display: flex;
        height: 100%;
        position: relative;
      }
      .terminal {
        height: 100%;
        padding: 1rem;
        display: flex;
        flex: 2;
        min-width: 0;
        min-height: 0;
      }
      .screen {
        margin: 0;
        overflow-wrap: anywhere;
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        overflow-y: auto;
      }
      #transcript {
        padding: 0.2rem;
        overflow: auto;
        flex: 1;
        min-block-size: 2em;
        text-shadow:
          0 0 2px currentColor,
          0 0 6px currentColor;
      }
      #transcript a {
        color: var(--ctp-frappe-blue);
      }
      .readme {
        flex: 1;
        padding: 1rem;
        overflow: auto;
        border-left: 1px solid var(--term-border);
        background: var(--ctp-latte-base);
        color: var(--ctp-latte-text);
        min-width: 0;
      }

      /* Mobile toggle button */
      .mobile-toggle {
        display: none;
        position: fixed;
        top: 0.5rem;
        right: 1rem;
        z-index: 1000;
        background: var(--ctp-frappe-blue);
        color: var(--ctp-frappe-base);
        border: none;
        border-radius: 0.3rem;
        min-height: 44px;
        padding: 0.2em 0.65em;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s;
      }
      .mobile-toggle:active {
        transform: scale(0.95);
      }

      /* Responsive styles */
      @media (max-width: 768px) {
        .layout {
          flex-direction: column;
        }
        .terminal {
          flex: 1;
          padding: max(52px, 2.65rem) 0.75rem 0.75rem;
        }
        .readme {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 999;
          padding-block-start: max(52px, 2.65rem);
          border-left: none;
          border-top: 4px solid var(--ctp-frappe-blue);
          visibility: hidden;
          transform: translateY(100%);
          transition: transform 0.3s ease;
        }
        .readme.show {
          visibility: visible;
          transform: translateY(0);
        }
        .mobile-toggle {
          display: block;
        }
        #transcript {
          text-shadow: none;
        }
      }

      /* Tablet styles */
      @media (min-width: 769px) and (max-width: 1024px) {
        .terminal {
          flex: 1.5;
        }
        .readme {
          flex: 1;
        }
      }

      /* Large desktop */
      @media (min-width: 1440px) {
        body {
          font-size: 1.125rem;
        }
        .layout {
          margin: 0 auto;
        }
      }

      /* Catppuccin Latte styling for documentation content */
      .readme h1,
      .readme h2,
      .readme h3,
      .readme h4,
      .readme h5,
      .readme h6 {
        color: var(--ctp-latte-blue);
        border-bottom: 2px solid var(--ctp-latte-surface1);
        padding-bottom: 0.3em;
      }

      /* Styling for different document types */
      .readme .nfo-content {
        font-family: "Courier New", "DejaVu Sans Mono", monospace;
        font-size: 12px;
        line-height: 1.2;
        color: var(--ctp-latte-text);
        background: var(--ctp-latte-mantle);
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
        white-space: pre;
        border-left: 4px solid var(--ctp-latte-mauve);
      }

      .readme .text-content {
        color: var(--ctp-latte-text);
        background: var(--ctp-latte-surface0);
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
        white-space: pre-wrap;
        border-left: 4px solid var(--ctp-latte-green);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "DejaVu Sans Mono", monospace;
      }

      .readme h1 {
        color: var(--ctp-latte-red);
      }
      .readme h2 {
        color: var(--ctp-latte-peach);
      }
      .readme h3 {
        color: var(--ctp-latte-yellow);
      }
      .readme h4 {
        color: var(--ctp-latte-green);
      }
      .readme h5 {
        color: var(--ctp-latte-teal);
      }
      .readme h6 {
        color: var(--ctp-latte-blue);
      }

      .readme p {
        color: var(--ctp-latte-text);
        line-height: 1.6;
      }

      .readme a {
        color: var(--ctp-latte-sapphire);
        text-decoration: none;
      }

      .readme a:hover {
        color: var(--ctp-latte-blue);
        text-decoration: underline;
      }

      .readme img {
        max-width: 100%;
        height: auto;
      }

      .readme .readme-notice {
        font-weight: bold;
      }

      .readme code {
        background: var(--ctp-latte-surface0);
        color: var(--ctp-latte-red);
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-size: 0.9em;
      }

      .readme pre {
        background: var(--ctp-latte-mantle);
        color: var(--ctp-latte-text);
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
        border-left: 4px solid var(--ctp-latte-blue);
        line-height: 1;
      }

      .readme pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .readme blockquote {
        border-left: 4px solid var(--ctp-latte-mauve);
        margin: 0;
        padding-left: 1em;
        color: var(--ctp-latte-subtext0);
        font-style: italic;
      }

      .readme ul,
      .readme ol {
        color: var(--ctp-latte-text);
      }

      .readme li {
        margin: 0.2em 0;
      }

      .readme strong {
        color: var(--ctp-latte-red);
        font-weight: bold;
      }

      .readme em {
        color: var(--ctp-latte-mauve);
        font-style: italic;
      }

      .readme table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
      }

      .readme th,
      .readme td {
        border: 1px solid var(--ctp-latte-surface1);
        padding: 0.5em;
        text-align: left;
      }

      .readme th {
        background: var(--ctp-latte-surface0);
        color: var(--ctp-latte-blue);
        font-weight: bold;
      }

      .readme hr {
        border: none;
        height: 2px;
        background: var(--ctp-latte-surface1);
        margin: 2em 0;
      }

      /* Document type indicator */
      .readme[data-doc-type]:not([data-doc-type=""])::before {
        content: attr(data-doc-type);
        display: block;
        font-size: 0.8em;
        color: var(--ctp-latte-subtext0);
        text-transform: uppercase;
        margin-bottom: 0.5em;
        padding: 0.2em 0.5em;
        background: var(--ctp-latte-surface1);
        border-radius: 3px;
        width: fit-content;
      }
      .line {
        display: block;
        white-space: pre-wrap;
      }
      .ps1 {
        color: var(--ctp-frappe-green);
      }
      .help-version { color: #666; }
      .help-note { color: #888; }
      .help-heading { color: #aaa; }
      .help-description { color: #bbb; }
      .input {
        color: var(--ctp-frappe-text);
      }
      .terminal-control {
        font: inherit;
        color: var(--term-text);
        background: var(--term-bg);
        border: 1px solid currentColor;
        border-radius: 0.25rem;
        padding: 0.15em 0.45em;
        cursor: pointer;
      }
      .terminal-control:hover {
        border-color: var(--olivetti);
      }
      :focus-visible {
        outline: 2px solid var(--ctp-frappe-sky);
        outline-offset: 2px;
      }
      .readme :focus-visible,
      .readme:focus-visible {
        outline-color: var(--ctp-latte-blue);
        outline-offset: -2px;
      }
      .out {
        color: var(--ctp-frappe-text);
      }
      .out {
        opacity: 0.85;
        line-height: 1.18;
      }
      .terminal-image {
        margin: 0.5em 0;
      }
      .terminal-image a {
        display: inline-block;
      }
      .terminal-image img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .terminal-image div {
        color: var(--ctp-frappe-green);
        font-size: 0.85em;
        margin-top: 0.25em;
      }
      /* Clickable files/directories */
      .clickable-file {
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      .clickable-file:hover {
        opacity: 1;
        text-shadow: 0 0 8px currentColor;
      }
      .command-row,
      .share-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.35rem 0.65rem;
      }
      .terminal-input {
        flex: 1;
        min-inline-size: min(10ch, 100%);
        font: inherit;
        background: var(--ctp-frappe-mantle);
        color: var(--term-text);
        caret-color: var(--olivetti);
        border: 1px solid var(--term-border);
        border-radius: 0.25rem;
        padding: 0.15em 0.4em;
      }
      #command-form {
        padding: 0.2rem;
        flex-shrink: 0;
      }
      #completions {
        margin-block-start: 0.25rem;
        padding-inline: 0.25rem;
        border: 1px solid var(--term-border);
        border-radius: 0.25rem;
        background: var(--ctp-frappe-mantle);
      }
      #completion-hint {
        margin: 0.25em 0.35em;
      }
      #completion-options {
        margin: 0;
        padding: 0.2rem;
        list-style: none;
        max-block-size: min(28vh, 12rem);
        overflow: auto;
      }
      #completion-options li {
        padding: 0.2em 0.35em;
        cursor: pointer;
      }
      #completion-options li:hover,
      #completion-options [aria-selected="true"] {
        color: var(--ctp-frappe-base);
        background: var(--olivetti);
      }
      @media (pointer: coarse) {
        .terminal-control,
        .terminal-input,
        #completion-options li {
          min-block-size: 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .readme, .mobile-toggle, .clickable-file {
          transition: none;
        }
        .mobile-toggle:active {
          transform: none;
        }
      }
      ::selection {
        background: var(--ctp-frappe-mauve);
        color: var(--ctp-frappe-base);
      }
      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <template id="terminal-help">{{HELP_MARKUP}}</template>
    <div
      class="layout"
      data-initial-path="{{INITIAL_PATH}}"
    >
      <section class="terminal" aria-label="Terminal">
        <div id="screen" class="screen">
          <div id="transcript" role="region" aria-label="Terminal output" tabindex="0"></div>
          <form id="command-form">
            <div class="command-row">
              <span class="ps1" id="command-prompt"></span>
              <label class="visually-hidden" for="command">Terminal command</label>
              <input
                id="command"
                class="terminal-input"
                type="text"
                inputmode="text"
                enterkeyhint="go"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="command-prompt command-help"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="completion-options"
                aria-expanded="false"
              />
              <button class="terminal-control" id="complete-command" type="button">Complete</button>
            </div>
            <span class="visually-hidden" id="command-help">Press Enter to run a command. Use Complete for path suggestions.</span>
            <div id="completions" hidden>
              <p id="completion-hint"></p>
              <ul id="completion-options" role="listbox" aria-label="Path suggestions" hidden></ul>
            </div>
          </form>
          <div id="directory-error" class="out" hidden>
            <span id="directory-error-message"></span>
            <button class="terminal-control" type="button" id="retry-directory">Retry directory</button>
          </div>
          <div class="visually-hidden" id="terminal-status" role="status"></div>
        </div>
      </section>
      <aside
        id="readme"
        class="readme"
        aria-label="README"
        tabindex="0"
      ></aside>
      <button
        class="mobile-toggle"
        id="readme-toggle"
        type="button"
        data-on-click="terminalView.toggleReadme()"
        aria-controls="readme"
        aria-expanded="false"
        aria-label="Show README"
      >README</button>
    </div>

  </body>
</html>
