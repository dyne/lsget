      window.terminalView = (() => {
        const htmlNamespace = "http://www.w3.org/1999/xhtml";
        const documentTags = new Set([
          "a", "b", "blockquote", "br", "code", "dd", "del", "div", "dl", "dt",
          "em", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "i", "img", "input",
          "kbd", "li", "ol", "p", "pre", "s", "span", "strong", "sub", "sup",
          "table", "tbody", "td", "th", "thead", "tr", "ul",
        ]);
        const ansiColors = new Map([
          ["31", "#e78284"], ["32", "#a6d189"], ["33", "#e5c890"], ["34", "#8caaee"],
          ["35", "#f4b8e4"], ["36", "#81c8be"], ["37", "#c6d0f5"], ["90", "#737994"],
          ["92", "#a6d189"], ["93", "#e5c890"], ["96", "#99d1db"],
        ]);

        function safeURL(value, base, allowMail = false) {
          if (typeof value !== "string" || !value.trim()) return null;
          try {
            const url = new URL(value, base);
            if (url.protocol === "http:" || url.protocol === "https:" ||
                (allowMail && url.protocol === "mailto:")) return url;
          } catch {}
          return null;
        }

        function pathURL(path) {
          return path.split("/").map(encodeURIComponent).join("/");
        }

        function sameOriginURL(value) {
          const url = safeURL(value, window.location.href);
          return url?.origin === window.location.origin ? url.href : null;
        }

        function documentLink(value, cwd) {
          const base = new URL(pathURL(cwd), window.location.origin);
          if (!value?.trim().startsWith("#") && !base.pathname.endsWith("/")) base.pathname += "/";
          return safeURL(value, base, true);
        }

        // Parse Markdown's HTML in an inert template, then create fresh nodes.
        // Source nodes and attributes never move into the live document.
        function renderMarkdown(parent, content, cwd) {
          const source = document.createElement("template");
          source.innerHTML = marked.parse(content);
          const anchors = new Map();
          const fragmentLinks = [];

          function copyChildren(target, from) {
            for (const child of from.childNodes) {
              if (child.nodeType === Node.TEXT_NODE) {
                target.append(child.data);
                continue;
              }
              if (child.nodeType !== Node.ELEMENT_NODE || child.namespaceURI !== htmlNamespace) continue;
              const tag = child.localName;
              if (!documentTags.has(tag)) {
                if (tag !== "script" && tag !== "style") copyChildren(target, child);
                continue;
              }
              const node = document.createElement(tag);

              if (tag === "a") {
                const href = child.getAttribute("href");
                const url = documentLink(href, cwd);
                if (url) {
                  node.href = url.href;
                  if (href.trim().startsWith("#")) fragmentLinks.push({ node, url });
                }
              } else if (tag === "img") {
                const directory = pathURL(cwd).replace(/\/$/, "") + "/";
                const url = safeURL(child.getAttribute("src"), new URL(directory, window.location.origin));
                const alt = child.getAttribute("alt") || "";
                if (!url) {
                  target.append(alt);
                  continue;
                }
                node.alt = alt;
                node.referrerPolicy = "no-referrer";
                node.src = url.href;
                for (const dimension of ["height", "width"]) {
                  const size = child.getAttribute(dimension);
                  if (/^[1-9]\d{0,3}$/.test(size)) node.setAttribute(dimension, size);
                }
              } else if (tag === "input") {
                if (child.getAttribute("type") !== "checkbox" || !child.disabled) continue;
                node.type = "checkbox";
                node.checked = child.checked;
                node.disabled = true;
              } else if (tag === "ol" && /^-?\d{1,9}$/.test(child.getAttribute("start"))) {
                node.start = child.start;
              } else if (tag === "td" || tag === "th") {
                const align = child.getAttribute("align");
                if (["left", "center", "right"].includes(align)) node.setAttribute("align", align);
              }
              if ((tag === "a" || tag === "img") && child.hasAttribute("title")) node.title = child.title;
              // Use generated IDs so document targets cannot shadow shell elements.
              const names = [child.getAttribute("id"), tag === "a" ? child.getAttribute("name") : null];
              for (const name of names) {
                if (name && !anchors.has(name)) {
                  if (!node.id) node.id = "readme-anchor-" + anchors.size;
                  anchors.set(name, node.id);
                }
              }
              copyChildren(node, child);
              target.append(node);
            }
          }

          copyChildren(parent, source.content);
          for (const { node, url } of fragmentLinks) {
            let name = url.hash.slice(1);
            try { name = decodeURIComponent(name); } catch {}
            if (anchors.has(name)) {
              url.hash = anchors.get(name);
              node.href = url.href;
            }
          }
        }

        function renderRST(parent, content, cwd) {
          const headings = { "=": "h1", "-": "h2", "^": "h3", '"': "h4" };
          function inline(node, text) {
            const pattern = /\x60([^\x60]+) <([^<>\r\n]+)>\x60_|\*\*([^*\r\n]+)\*\*|\*([^*\r\n]+)\*/g;
            let offset = 0;
            for (const match of text.matchAll(pattern)) {
              node.append(text.slice(offset, match.index));
              const [token, label, href, strong, em] = match;
              const part = document.createElement(label ? "a" : strong ? "strong" : "em");
              part.textContent = label ?? strong ?? em;
              if (href) {
                const url = documentLink(href, cwd);
                if (url) part.href = url.href;
              }
              node.append(part);
              offset = match.index + token.length;
            }
            node.append(text.slice(offset));
          }
          for (let block of content.split(/\r?\n(?:[ \t]*\r?\n)+/)) {
            const heading = block.match(/^(.+)\r?\n(=+|-+|\^+|"+)(?:\r?\n|$)/);
            if (heading) {
              const node = document.createElement(headings[heading[2][0]]);
              inline(node, heading[1]);
              parent.append(node);
              block = block.slice(heading[0].length);
            }
            if (!block.trim()) continue;
            const paragraph = document.createElement("p");
            const lines = block.split(/\r?\n/);
            for (const [i, line] of lines.entries()) {
              if (i !== 0) paragraph.append("\n");
              if (line.startsWith("    ")) {
                const code = document.createElement("code");
                code.textContent = line.slice(4);
                paragraph.append(code);
              } else {
                inline(paragraph, line.replace(/::$/, ""));
              }
            }
            parent.append(paragraph);
          }
        }

        function readme(panel, response) {
          const { readme, docType, cwd = "/", readmeTruncated } = response;
          if (typeof readme !== "string") return;
          const fragment = document.createDocumentFragment();
          if (readmeTruncated) {
            const notice = document.createElement("p");
            notice.className = "readme-notice";
            notice.textContent = "README preview truncated.";
            fragment.append(notice);
          }
          if (readme) {
            if (docType === "markdown") {
              renderMarkdown(fragment, readme, cwd);
            } else if (docType === "rst") {
              renderRST(fragment, readme, cwd);
            } else {
              const text = document.createElement("pre");
              text.className = docType === "nfo" ? "nfo-content" : "text-content";
              text.textContent = readme;
              fragment.append(text);
            }
          }
          panel.replaceChildren(fragment);
        }

        function line(output = false) {
          const node = document.createElement("div");
          node.className = output ? "line out" : "line";
          return node;
        }

        function ansiLine(text, clickable) {
          const node = line(true);
          const sequence = /\x1b\[([0-?]*)([ -/]*)([@-~])/g;
          let color = "";
          let bold = false;
          let offset = 0;
          let run = "";
          function flush() {
            if (!run) return;
            if (!color && !bold) {
              node.append(run);
            } else {
              const span = document.createElement("span");
              span.textContent = run;
              if (color) span.style.color = color;
              if (bold) span.style.fontWeight = "400";
              if (clickable && color) {
                const dir = run.endsWith("/");
                span.className = "clickable-file";
                span.dataset.cmd = dir ? "cd" : "cat";
                span.dataset.file = dir && run !== "/" ? run.slice(0, -1) : run;
              }
              node.append(span);
            }
            run = "";
          }

          for (const match of text.matchAll(sequence)) {
            run += text.slice(offset, match.index);
            offset = match.index + match[0].length;
            const [, parameter, intermediate, final] = match;
            if (intermediate || final !== "m") continue;
            if (parameter !== "0" && parameter !== "1" && !ansiColors.has(parameter)) continue;
            flush();
            if (parameter === "0") {
              color = "";
              bold = false;
            } else if (parameter === "1") {
              bold = true;
            } else {
              color = ansiColors.get(parameter);
            }
          }
          run += text.slice(offset);
          flush();
          return node;
        }

        function appendCommand(transcript, ps1, command) {
          const node = line();
          const prompt = document.createElement("span");
          prompt.className = "ps1";
          prompt.textContent = ps1;
          node.append(prompt, command);
          transcript.append(node);
        }

        function appendHelp(transcript) {
          const node = line(true);
          node.append(document.getElementById("terminal-help").content.cloneNode(true));
          transcript.append(node);
        }

        function appendImage(transcript, image) {
          const href = sameOriginURL(image.url);
          if (!href) return;
          const node = line(true);
          node.classList.add("terminal-image");
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener";
          const picture = document.createElement("img");
          picture.src = href;
          picture.alt = image.name;
          link.append(picture);
          const caption = document.createElement("div");
          caption.textContent = "📷 " + image.name + " (" + image.size + ")";
          node.append(link, caption);
          transcript.append(node);
        }

        function downloadLink(value) {
          const href = sameOriginURL(value);
          if (!href) return null;
          const link = document.createElement("a");
          link.href = href;
          link.download = "";
          link.textContent = "Download file";
          return link;
        }

        return { ansiLine, appendCommand, appendHelp, appendImage, downloadLink, pathURL, readme, sameOriginURL };
      })();

    </script>

        color: var(--ctp-frappe-green);
        font-size: 0.85em;
        margin-top: 0.25em;
      }
      /* Clickable files/directories */
      .clickable-file {
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      .clickable-file:hover {
        opacity: 1;
        text-shadow: 0 0 8px currentColor;
      }
      .command-row,
      .share-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.35rem 0.65rem;
      }
      .terminal-input {
        flex: 1;
        min-inline-size: min(10ch, 100%);
        font: inherit;
        background: var(--ctp-frappe-mantle);
        color: var(--term-text);
        caret-color: var(--olivetti);
        border: 1px solid var(--term-border);
        border-radius: 0.25rem;
        padding: 0.15em 0.4em;
      }
      #command-form {
        padding: 0.2rem;
        flex-shrink: 0;
      }
      #completions {
        margin-block-start: 0.25rem;
        padding-inline: 0.25rem;
        border: 1px solid var(--term-border);
        border-radius: 0.25rem;
        background: var(--ctp-frappe-mantle);
      }
      #completion-hint {
        margin: 0.25em 0.35em;
      }
      #completion-options {
        margin: 0;
        padding: 0.2rem;
        list-style: none;
        max-block-size: min(28vh, 12rem);
        overflow: auto;
      }
      #completion-options li {
        padding: 0.2em 0.35em;
        cursor: pointer;
      }
      #completion-options li:hover,
      #completion-options [aria-selected="true"] {
        color: var(--ctp-frappe-base);
        background: var(--olivetti);
      }
      @media (pointer: coarse) {
        .terminal-control,
        .terminal-input,
        #completion-options li {
          min-block-size: 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .readme, .mobile-toggle, .clickable-file {
          transition: none;
        }
        .mobile-toggle:active {
          transform: none;
        }
      }
      ::selection {
        background: var(--ctp-frappe-mauve);
        color: var(--ctp-frappe-base);
      }
      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <template id="terminal-help">{{HELP_MARKUP}}</template>
    <div
      class="layout"
      data-initial-path="{{INITIAL_PATH}}"
    >
      <section class="terminal" aria-label="Terminal">
        <div id="screen" class="screen">
          <div id="transcript" role="region" aria-label="Terminal output" tabindex="0"></div>
          <form id="command-form">
            <div class="command-row">
              <span class="ps1" id="command-prompt"></span>
              <label class="visually-hidden" for="command">Terminal command</label>
              <input
                id="command"
                class="terminal-input"
                type="text"
                inputmode="text"
                enterkeyhint="go"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="command-prompt command-help"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="completion-options"
                aria-expanded="false"
              />
              <button class="terminal-control" id="complete-command" type="button">Complete</button>
            </div>
            <span class="visually-hidden" id="command-help">Press Enter to run a command. Use Complete for path suggestions.</span>
            <div id="completions" hidden>
              <p id="completion-hint"></p>
              <ul id="completion-options" role="listbox" aria-label="Path suggestions" hidden></ul>
            </div>
          </form>
          <div id="directory-error" class="out" hidden>
            <span id="directory-error-message"></span>
            <button class="terminal-control" type="button" id="retry-directory">Retry directory</button>
          </div>
          <div class="visually-hidden" id="terminal-status" role="status"></div>
        </div>
      </section>
      <aside
        id="readme"
        class="readme"
        aria-label="README"
        tabindex="0"
      ></aside>
      <button
        class="mobile-toggle"
        id="readme-toggle"
        type="button"
        data-on-click="terminalView.toggleReadme()"
        aria-controls="readme"
        aria-expanded="false"
        aria-label="Show README"
      >README</button>
    </div>

    <script nonce="{{CSP_NONCE}}">
      (() => {
        const layout = document.querySelector(".layout");
        const terminal = layout.querySelector(".terminal");
        const form = document.getElementById("command-form");
        const input = document.getElementById("command");
        const completeButton = document.getElementById("complete-command");
        const transcript = document.getElementById("transcript");
        const completions = document.getElementById("completions");
        const completionHint = document.getElementById("completion-hint");
        const completionOptions = document.getElementById("completion-options");
        const panel = document.getElementById("readme");
        const readmeToggle = document.getElementById("readme-toggle");
        const narrow = window.matchMedia("(max-width: 768px)");
        const directoryError = document.getElementById("directory-error");
        const directoryErrorMessage = document.getElementById("directory-error-message");
        const retryDirectory = document.getElementById("retry-directory");
        const prompt = document.getElementById("command-prompt");
        const status = document.getElementById("terminal-status");

        const maxTranscriptEntries = 100;
        const maxTranscriptCharacters = 512 * 1024;
        const maxHistoryEntries = 100;
        const maxHistoryCommandLength = 8192;
        const commandHistory = [];
        let historyIndex = 0;
        let transcriptCharacters = 0;
        let cwd = layout.dataset.initialPath || "/";
        let directoryRequest;
        let commandRequest;
        let completionRequest;
        let suggestions = [];
        let selectedSuggestion = -1;
        let readmeOpen = false;

        function focusInput() {
          input.focus({ preventScroll: true });
        }

        function scrollTranscript() {
          requestAnimationFrame(() => { transcript.scrollTop = transcript.scrollHeight; });
        }

        function announce(message) {
          status.textContent = message;
        }

        function appendTranscript(render) {
          const entry = document.createElement("div");
          render(entry);
          if (!entry.hasChildNodes()) return;
          transcript.append(entry);
          transcriptCharacters += entry.textContent.length;
          while (transcript.children.length > maxTranscriptEntries ||
                 transcriptCharacters > maxTranscriptCharacters) {
            const oldest = transcript.firstElementChild;
            transcriptCharacters -= oldest.textContent.length;
            oldest.remove();
          }
          scrollTranscript();
        }

        function appendMessage(text) {
          appendTranscript(entry => entry.append(terminalView.ansiLine(text, false)));
          announce(text);
        }

        function setInput(text, position = text.length) {
          input.value = text;
          input.setSelectionRange(position, position);
        }

        function quoteOperand(path) {
          return /[\s"'\\]/.test(path) ? '"' + path.replace(/["\\]/g, "\\$&") + '"' : path;
        }

        function rememberCommand(command) {
          if (command && command.length <= maxHistoryCommandLength) {
            commandHistory.push(command);
            if (commandHistory.length > maxHistoryEntries) commandHistory.shift();
          }
          historyIndex = commandHistory.length;
        }

        function setDirectory(path) {
          cwd = path;
          prompt.textContent = "guest@browser:" + path + "$ ";
        }

        function clearCompletion() {
          completionRequest?.abort();
          completionRequest = undefined;
          suggestions = [];
          selectedSuggestion = -1;
          input.removeAttribute("aria-activedescendant");
          input.setAttribute("aria-expanded", "false");
          completions.hidden = true;
          completionHint.textContent = "";
          completionOptions.hidden = true;
          completionOptions.replaceChildren();
        }

        function showCompletion(message, announcement = message) {
          completionHint.textContent = message;
          completions.hidden = false;
          announce(announcement);
          scrollTranscript();
        }

        function highlightSuggestion(index) {
          completionOptions.children[selectedSuggestion]?.setAttribute("aria-selected", "false");
          selectedSuggestion = index;
          const option = completionOptions.children[index];
          option.setAttribute("aria-selected", "true");
          input.setAttribute("aria-activedescendant", option.id);
          option.scrollIntoView({ block: "nearest", inline: "nearest" });
        }

        function acceptSuggestion(index) {
          const suggestion = suggestions[index];
          setInput(suggestion.command);
          clearCompletion();
          focusInput();
          announce("Completed " + suggestion.name + ".");
        }

        function updateReadme() {
          const open = narrow.matches && readmeOpen;
          panel.classList.toggle("show", open);
          panel.inert = narrow.matches && !open;
          terminal.inert = open;
          readmeToggle.setAttribute("aria-expanded", String(open));
          readmeToggle.setAttribute("aria-label", open ? "Close README" : "Show README");
          readmeToggle.textContent = open ? "Close README" : "README";
        }

        function setReadmeOpen(open) {
          readmeOpen = open;
          updateReadme();
          if (open) {
            panel.focus({ preventScroll: true });
          } else {
            focusInput();
          }
        }

        async function requestJSON(endpoint, directory, request, body) {
          const query = new URLSearchParams({ cwd: directory });
          const response = await fetch("/api/" + endpoint + "?" + query, {
            signal: request.signal,
            cache: "no-store",
            ...(body && {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }),
          });
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        }

        async function listDirectory(directory, request) {
          const { output } = await requestJSON("exec", directory, request, { input: "ls" });
          if (request.signal.aborted) return;
          appendTranscript(entry => {
            terminalView.appendCommand(entry, prompt.textContent, "ls");
            if (output) entry.append(terminalView.ansiLine(output, true));
          });
        }

        async function loadDirectory() {
          directoryRequest?.abort();
          const request = new AbortController();
          directoryRequest = request;
          directoryError.hidden = true;
          const directory = cwd;
          try {
            const response = await requestJSON("config", directory, request);
            if (request.signal.aborted) return;
            terminalView.readme(panel, response);
            await listDirectory(directory, request);
          } catch (error) {
            if (request.signal.aborted) return;
            directoryErrorMessage.textContent = "Could not load this directory (" + error.message + ").";
            directoryError.hidden = false;
            announce(directoryErrorMessage.textContent);
          } finally {
            if (directoryRequest === request) directoryRequest = undefined;
          }
        }

        async function copyURL(url, request) {
          try {
            if (!navigator.clipboard) throw new Error("Clipboard unavailable");
            await navigator.clipboard.writeText(url);
            if (!request?.signal.aborted) appendMessage("URL copied to clipboard.");
          } catch {
            if (!request?.signal.aborted) appendMessage("Could not copy the URL. Select it above to copy it manually.");
          }
        }

        function appendShareControls(entry, url) {
          const controls = document.createElement("div");
          controls.className = "share-controls";
          const field = document.createElement("input");
          field.className = "terminal-input";
          field.readOnly = true;
          field.value = url;
          field.setAttribute("aria-label", "Shareable URL");
          field.addEventListener("focus", () => field.select());
          const button = document.createElement("button");
          button.type = "button";
          button.className = "terminal-control";
          button.textContent = "Copy URL";
          button.addEventListener("click", () => { void copyURL(url); });
          controls.append("Shareable URL:", field, button);
          entry.append(controls);
        }

        async function runCommand(command, listAfterCd = false) {
          commandRequest?.abort();
          clearCompletion();
          appendTranscript(entry => terminalView.appendCommand(entry, prompt.textContent, command));
          if (!command.trim()) return;
          const request = new AbortController();
          commandRequest = request;
          try {
            const directory = cwd;
            const response = await requestJSON("exec", directory, request, { input: command });
            if (request.signal.aborted) return;
            const { output, help, image, download, clipboard, redirect } = response;
            const link = terminalView.downloadLink(download);
            appendTranscript(entry => {
              if (output && !clipboard) entry.append(terminalView.ansiLine(output, /^\s*(ls|dir|tree)(\s|$)/.test(command)));
              if (help) terminalView.appendHelp(entry);
              if (image) terminalView.appendImage(entry, image);
              if (link) entry.append(link);
              if (clipboard) appendShareControls(entry, clipboard);
            });
            if (link) {
              announce("Download link available in terminal output.");
              link.click();
            } else if (!clipboard && (output || help || image)) {
              announce(output && output.length <= 160 && !output.includes("\x1b") ? output : "Command output is available.");
            }
            if (clipboard) await copyURL(clipboard, request);
            if (request.signal.aborted) return;
            const destination = typeof redirect === "string" && redirect.startsWith("/")
              ? terminalView.sameOriginURL(terminalView.pathURL(redirect))
              : null;
            if (destination) {
              window.location.assign(destination);
              return;
            }
            if (typeof response.cwd === "string" && typeof response.readme === "string") {
              directoryRequest?.abort();
              directoryError.hidden = true;
              clearCompletion();
              terminalView.readme(panel, response);
              if (response.cwd !== cwd) {
                setDirectory(response.cwd);
                window.history.pushState({ cwd }, "", terminalView.pathURL(cwd));
                announce("Directory " + cwd + ".");
              }
              if (listAfterCd) await listDirectory(cwd, request);
            }
          } catch (error) {
            if (!request.signal.aborted) {
              appendMessage("Could not run the command (" + error.message + "). Try again.");
            }
          } finally {
            if (commandRequest === request) commandRequest = undefined;
          }
        }

        async function completeInput() {
          clearCompletion();
          const match = input.value.match(/^\s*(\S+)(?:\s+(.*))?$/);
          const command = match?.[1];
          const argument = match?.[2] || "";
          const operand = [...argument.matchAll(/"(?:\\.|[^"\\])*"?|'[^']*'?|\S+/g)]
            .findLast(token => !token[0].startsWith("-"));
          let pathArg = operand?.[0] || "";
          if (pathArg.startsWith('"')) {
            pathArg = pathArg.slice(1).replace(/\\(.)|("$)/g, (_, escaped) => escaped || "");
          } else if (pathArg.startsWith("'")) {
            pathArg = pathArg.slice(1).replace(/'$/, "");
          }
          const dirsOnly = command === "cd";
          const textOnly = command === "cat";
          const filesOnly = textOnly || ["wget", "get", "rget", "download", "url", "share", "sum", "checksum"].includes(command);
          if (!(dirsOnly || filesOnly || command === "ls" || command === "dir")) {
            showCompletion("Type ls, cd, cat, or another command with a path to complete.");
            return;
          }

          const request = new AbortController();
          completionRequest = request;
          try {
            const { items, truncated } = await requestJSON("complete", cwd, request, {
              path: pathArg, dirsOnly, filesOnly, textOnly,
            });
            if (request.signal.aborted) return;
            if (!items?.length) {
              showCompletion("No matching paths.");
              return;
            }
            const dirPart = pathArg.slice(0, pathArg.lastIndexOf("/") + 1);
            const flags = operand ? argument.slice(0, operand.index) : argument.trimEnd();
            const prefix = command + (flags ? " " + flags.trimEnd() : "") + " ";
            suggestions = items.map(item => {
              const name = item.name + (item.dir ? "/" : "");
              return { name, command: prefix + quoteOperand(dirPart + name) };
            });
            if (suggestions.length === 1 && !truncated) {
              acceptSuggestion(0);
              return;
            }

            const options = document.createDocumentFragment();
            for (const [index, suggestion] of suggestions.entries()) {
              const option = document.createElement("li");
              option.id = "completion-option-" + index;
              option.setAttribute("role", "option");
              option.setAttribute("aria-selected", "false");
              option.textContent = suggestion.name;
              option.dataset.index = index;
              options.append(option);
            }
            completionOptions.replaceChildren(options);
            completionOptions.hidden = false;
            input.setAttribute("aria-expanded", "true");
            const count = (truncated ? "Showing " : "") + suggestions.length + " paths.";
            showCompletion(count + " ↑/↓ then Enter", count + " Use the up or down arrow, then Enter.");
          } catch (error) {
            if (request.signal.aborted) return;
            showCompletion(error.message === "HTTP 503"
              ? "Completion busy. Try Complete again."
              : "Could not complete the path. Try Complete again.");
          } finally {
            if (completionRequest === request) completionRequest = undefined;
          }
        }

        input.addEventListener("input", clearCompletion);
        input.addEventListener("blur", clearCompletion);

        completeButton.addEventListener("click", () => {
          focusInput();
          void completeInput();
        });

        completionOptions.addEventListener("mousedown", event => event.preventDefault());
        completionOptions.addEventListener("click", event => {
          const option = event.target.closest("[role=option]");
          if (option) acceptSuggestion(Number(option.dataset.index));
        });

        form.addEventListener("submit", event => {
          event.preventDefault();
          if (selectedSuggestion >= 0) {
            acceptSuggestion(selectedSuggestion);
            return;
          }
          const command = input.value;
          rememberCommand(command);
          setInput("");
          void runCommand(command);
        });

        input.addEventListener("keydown", event => {
          if (event.isComposing) return;
          const key = event.key;
          if (key === "Enter") {
            form.requestSubmit();
          } else if (key === "Escape" && (completionRequest || !completions.hidden)) {
            clearCompletion();
            announce("Path suggestions closed.");
          } else if (key === "ArrowUp" || key === "ArrowDown") {
            if (event.shiftKey || event.altKey || event.ctrlKey || event.metaKey) return;
            const step = key === "ArrowUp" ? -1 : 1;
            if (!completionOptions.hidden) {
              const initial = step > 0 ? 0 : suggestions.length - 1;
              const index = selectedSuggestion < 0 ? initial
                : (selectedSuggestion + step + suggestions.length) % suggestions.length;
              highlightSuggestion(index);
            } else {
              const next = historyIndex + step;
              if (next >= 0 && next <= commandHistory.length) {
                historyIndex = next;
                setInput(commandHistory[historyIndex] || "");
              }
            }
          } else if (event.ctrlKey && key === "u") {
            setInput("");
            clearCompletion();
          } else if (event.ctrlKey && key === "w") {
            const prefix = input.value.slice(0, input.selectionStart).replace(/\S*\s*$/, "");
            input.setRangeText("", prefix.length, input.selectionEnd, "end");
            clearCompletion();
          } else if (event.ctrlKey && key === "k") {
            setInput(input.value.slice(0, input.selectionStart));
            clearCompletion();
          } else if (event.ctrlKey && key === "l") {
            transcript.replaceChildren();
            transcriptCharacters = 0;
            announce("Terminal output cleared.");
          } else if (event.ctrlKey && key === "e") {
            input.setSelectionRange(input.value.length, input.value.length);
          } else {
            return;
          }
          event.preventDefault();
        });

        transcript.addEventListener("click", event => {
          if (window.getSelection()?.type === "Range") return;
          const item = event.target.closest(".clickable-file");
          if (!item) return;
          focusInput();
          const { cmd, file } = item.dataset;
          const command = cmd + " " + quoteOperand(file);
          rememberCommand(command);
          void runCommand(command, cmd === "cd");
          event.preventDefault();
        });

        terminalView.toggleReadme = () => setReadmeOpen(!readmeOpen);
        narrow.addEventListener("change", () => {
          const restoreFocus = narrow.matches &&
            (panel.contains(document.activeElement) || document.activeElement === readmeToggle);
          readmeOpen = false;
          updateReadme();
          if (restoreFocus) focusInput();
        });
        layout.addEventListener("keydown", event => {
          if (event.key === "Escape" && readmeOpen) {
            setReadmeOpen(false);
            event.preventDefault();
          }
        });
        retryDirectory.addEventListener("click", () => {
          focusInput();
          void loadDirectory();
        });

        window.addEventListener("popstate", event => {
          const path = event.state?.cwd || decodeURIComponent(window.location.pathname);
          if (path === cwd) return;
          commandRequest?.abort();
          clearCompletion();
          panel.replaceChildren();
          setDirectory(path);
          announce("Directory " + cwd + ".");
          void loadDirectory();
        });

        setDirectory(cwd);
        updateReadme();
        window.history.replaceState({ cwd }, "", terminalView.pathURL(cwd) + window.location.search + window.location.hash);
        appendTranscript(terminalView.appendHelp);
        focusInput();
        void loadDirectory();
      })();
    </script>
  </body>
</html>
