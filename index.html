      window.terminalView = (() => {
        const htmlNamespace = "http://www.w3.org/1999/xhtml";
        const documentTags = new Set([
          "a", "b", "blockquote", "br", "code", "dd", "del", "div", "dl", "dt",
          "em", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "i", "img", "input",
          "kbd", "li", "ol", "p", "pre", "s", "span", "strong", "sub", "sup",
          "table", "tbody", "td", "th", "thead", "tr", "ul",
        ]);
        const ansiColors = new Map([
          ["31", "#e78284"], ["32", "#a6d189"], ["33", "#e5c890"], ["34", "#8caaee"],
          ["35", "#f4b8e4"], ["36", "#81c8be"], ["37", "#c6d0f5"], ["90", "#737994"],
          ["92", "#a6d189"], ["93", "#e5c890"], ["96", "#99d1db"],
        ]);

        function safeURL(value, base, allowMail = false) {
          if (typeof value !== "string" || !value.trim()) return null;
          try {
            const url = new URL(value, base);
            if (url.protocol === "http:" || url.protocol === "https:" ||
                (allowMail && url.protocol === "mailto:")) return url;
          } catch {}
          return null;
        }

        function pathURL(path) {
          return path.split("/").map(encodeURIComponent).join("/");
        }

        function sameOriginURL(value) {
          const url = safeURL(value, window.location.href);
          return url?.origin === window.location.origin ? url.href : null;
        }

        function documentLink(value, cwd) {
          const base = new URL(pathURL(cwd), window.location.origin);
          if (!value?.trim().startsWith("#") && !base.pathname.endsWith("/")) base.pathname += "/";
          return safeURL(value, base, true);
        }

        // Parse Markdown's HTML in an inert template, then create fresh nodes.
        // Source nodes and attributes never move into the live document.
        function renderMarkdown(parent, content, cwd) {
          const source = document.createElement("template");
          source.innerHTML = marked.parse(content);
          const anchors = new Map();
          const fragmentLinks = [];

          function copyChildren(target, from) {
            for (const child of from.childNodes) {
              if (child.nodeType === Node.TEXT_NODE) {
                target.append(child.data);
                continue;
              }
              if (child.nodeType !== Node.ELEMENT_NODE || child.namespaceURI !== htmlNamespace) continue;
              const tag = child.localName;
              if (!documentTags.has(tag)) {
                if (tag !== "script" && tag !== "style") copyChildren(target, child);
                continue;
              }
              const node = document.createElement(tag);

              if (tag === "a") {
                const href = child.getAttribute("href");
                const url = documentLink(href, cwd);
                if (url) {
                  node.href = url.href;
                  if (href.trim().startsWith("#")) fragmentLinks.push({ node, url });
                }
              } else if (tag === "img") {
                const directory = pathURL(cwd).replace(/\/$/, "") + "/";
                const url = safeURL(child.getAttribute("src"), new URL(directory, window.location.origin));
                const alt = child.getAttribute("alt") || "";
                if (!url) {
                  target.append(alt);
                  continue;
                }
                node.alt = alt;
                node.referrerPolicy = "no-referrer";
                node.src = url.href;
                for (const dimension of ["height", "width"]) {
                  const size = child.getAttribute(dimension);
                  if (/^[1-9]\d{0,3}$/.test(size)) node.setAttribute(dimension, size);
                }
              } else if (tag === "input") {
                if (child.getAttribute("type") !== "checkbox" || !child.disabled) continue;
                node.type = "checkbox";
                node.checked = child.checked;
                node.disabled = true;
              } else if (tag === "ol" && /^-?\d{1,9}$/.test(child.getAttribute("start"))) {
                node.start = child.start;
              } else if (tag === "td" || tag === "th") {
                const align = child.getAttribute("align");
                if (["left", "center", "right"].includes(align)) node.setAttribute("align", align);
              }
              if ((tag === "a" || tag === "img") && child.hasAttribute("title")) node.title = child.title;
              // Use generated IDs so document targets cannot shadow shell elements.
              const names = [child.getAttribute("id"), tag === "a" ? child.getAttribute("name") : null];
              for (const name of names) {
                if (name && !anchors.has(name)) {
                  if (!node.id) node.id = "readme-anchor-" + anchors.size;
                  anchors.set(name, node.id);
                }
              }
              copyChildren(node, child);
              target.append(node);
            }
          }

          copyChildren(parent, source.content);
          for (const { node, url } of fragmentLinks) {
            let name = url.hash.slice(1);
            try { name = decodeURIComponent(name); } catch {}
            if (anchors.has(name)) {
              url.hash = anchors.get(name);
              node.href = url.href;
            }
          }
        }

        function renderRST(parent, content, cwd) {
          const headings = { "=": "h1", "-": "h2", "^": "h3", '"': "h4" };
          function inline(node, text) {
            const pattern = /\x60([^\x60]+) <([^<>\r\n]+)>\x60_|\*\*([^*\r\n]+)\*\*|\*([^*\r\n]+)\*/g;
            let offset = 0;
            for (const match of text.matchAll(pattern)) {
              node.append(text.slice(offset, match.index));
              const [token, label, href, strong, em] = match;
              const part = document.createElement(label ? "a" : strong ? "strong" : "em");
              part.textContent = label ?? strong ?? em;
              if (href) {
                const url = documentLink(href, cwd);
                if (url) part.href = url.href;
              }
              node.append(part);
              offset = match.index + token.length;
            }
            node.append(text.slice(offset));
          }
          for (let block of content.split(/\r?\n(?:[ \t]*\r?\n)+/)) {
            const heading = block.match(/^(.+)\r?\n(=+|-+|\^+|"+)(?:\r?\n|$)/);
            if (heading) {
              const node = document.createElement(headings[heading[2][0]]);
              inline(node, heading[1]);
              parent.append(node);
              block = block.slice(heading[0].length);
            }
            if (!block.trim()) continue;
            const paragraph = document.createElement("p");
            const lines = block.split(/\r?\n/);
            for (const [i, line] of lines.entries()) {
              if (i !== 0) paragraph.append("\n");
              if (line.startsWith("    ")) {
                const code = document.createElement("code");
                code.textContent = line.slice(4);
                paragraph.append(code);
              } else {
                inline(paragraph, line.replace(/::$/, ""));
              }
            }
            parent.append(paragraph);
          }
        }

        function readme(panel, response) {
          const { readme, docType, cwd = "/", readmeTruncated } = response;
          if (typeof readme !== "string") return;
          const fragment = document.createDocumentFragment();
          if (readmeTruncated) {
            const notice = document.createElement("p");
            notice.className = "readme-notice";
            notice.textContent = "README preview truncated.";
            fragment.append(notice);
          }
          if (readme) {
            if (docType === "markdown") {
              renderMarkdown(fragment, readme, cwd);
            } else if (docType === "rst") {
              renderRST(fragment, readme, cwd);
            } else {
              const text = document.createElement("pre");
              text.className = docType === "nfo" ? "nfo-content" : "text-content";
              text.textContent = readme;
              fragment.append(text);
            }
          }
          panel.replaceChildren(fragment);
        }

        function line(output = false) {
          const node = document.createElement("div");
          node.className = output ? "line out" : "line";
          return node;
        }

        function ansiLine(text, clickable) {
          const node = line(true);
          const sequence = /\x1b\[([0-?]*)([ -/]*)([@-~])/g;
          let color = "";
          let bold = false;
          let offset = 0;
          let run = "";
          function flush() {
            if (!run) return;
            if (!color && !bold) {
              node.append(run);
            } else {
              const span = document.createElement("span");
              span.textContent = run;
              if (color) span.style.color = color;
              if (bold) span.style.fontWeight = "400";
              if (clickable && color) {
                const dir = run.endsWith("/");
                span.className = "clickable-file";
                span.dataset.cmd = dir ? "cd" : "cat";
                span.dataset.file = dir && run !== "/" ? run.slice(0, -1) : run;
              }
              node.append(span);
            }
            run = "";
          }

          for (const match of text.matchAll(sequence)) {
            run += text.slice(offset, match.index);
            offset = match.index + match[0].length;
            const [, parameter, intermediate, final] = match;
            if (intermediate || final !== "m") continue;
            if (parameter !== "0" && parameter !== "1" && !ansiColors.has(parameter)) continue;
            flush();
            if (parameter === "0") {
              color = "";
              bold = false;
            } else if (parameter === "1") {
              bold = true;
            } else {
              color = ansiColors.get(parameter);
            }
          }
          run += text.slice(offset);
          flush();
          return node;
        }

        function appendCommand(transcript, ps1, command) {
          const node = line();
          const prompt = document.createElement("span");
          prompt.className = "ps1";
          prompt.textContent = ps1;
          node.append(prompt, command);
          transcript.append(node);
        }

        function appendHelp(transcript) {
          const node = line(true);
          node.append(document.getElementById("terminal-help").content.cloneNode(true));
          transcript.append(node);
        }

        function appendImage(transcript, image) {
          const href = sameOriginURL(image.url);
          if (!href) return;
          const node = line(true);
          node.classList.add("terminal-image");
          const link = document.createElement("a");
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener";
          const picture = document.createElement("img");
          picture.src = href;
          picture.alt = image.name;
          link.append(picture);
          const caption = document.createElement("div");
          caption.textContent = "📷 " + image.name + " (" + image.size + ")";
          node.append(link, caption);
          transcript.append(node);
        }

        function download(value) {
          const href = sameOriginURL(value);
          if (!href) return;
          const a = document.createElement("a");
          a.href = href;
          a.download = "";
          document.body.append(a);
          a.click();
          a.remove();
        }

        return { ansiLine, appendCommand, appendHelp, appendImage, download, pathURL, readme, sameOriginURL };
      })();

      window.longestCommonPrefix = function (arr) {
        if (!arr || !arr.length) return "";
        let prefix = arr[0];
        for (const word of arr.slice(1)) {
          let length = 0;
          while (length < prefix.length && prefix[length] === word[length]) length++;
          prefix = prefix.slice(0, length);
          if (!prefix) break;
        }
        return prefix;
      };

      // File actions only come from terminal output nodes.
      document.addEventListener("DOMContentLoaded", () => {
        const ghost = document.getElementById("ghost");
        const screen = document.getElementById("screen");
        if (!ghost || !screen) return;
        function submit(command) {
          ghost.value = command;
          ghost.dispatchEvent(new Event("input", { bubbles: true }));
          ghost.dispatchEvent(new KeyboardEvent("keydown", {
            key: "Enter", bubbles: true, cancelable: true,
          }));
        }
        screen.addEventListener("click", (event) => {
          const item = event.target.closest(".clickable-file");
          if (!item) return;
          const { cmd, file } = item.dataset;
          const operand = '"' + file.replace(/["\\]/g, "\\$&") + '"';
          submit(cmd + " " + operand);
          if (cmd === "cd") setTimeout(() => submit("ls"), 200);
          event.preventDefault();
        });
      });

      .terminal-image a {
        display: inline-block;
      }
      .terminal-image img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .terminal-image div {
        color: var(--ctp-frappe-green);
        font-size: 0.85em;
        margin-top: 0.25em;
      }
      /* Clickable files/directories */
      .clickable-file {
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      .clickable-file:hover {
        opacity: 1;
        text-shadow: 0 0 8px currentColor;
      }
      .cursor {
        display: inline-block;
        width: 0.6em;
        background: var(--ctp-frappe-text);
        color: var(--ctp-frappe-base);
      }
      .terminal:focus-within .cursor {
        animation: blink 1s steps(1, end) infinite;
      }
      .terminal:not(:focus-within) .cursor {
        animation: none;
        opacity: 0.5;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      ::selection {
        background: var(--ctp-frappe-mauve);
        color: var(--ctp-frappe-base);
      }
      .ghost {
        position: fixed;
        left: -10000px;
        top: auto;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        background: transparent;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <template id="terminal-help">{{HELP_MARKUP}}</template>
    <div
      class="layout"
      data-initial-path="{{INITIAL_PATH}}"
      data-signals='{ "ps1": "guest@browser:/$ ", "current": "", "cursorPos": 0, "history": [], "histIndex": 0, "showReadme": false }'
    >
      <div
        class="terminal"
        data-on-load="
            const initialPath = el.parentElement.dataset.initialPath || '/';
            const ghost = el.querySelector('#ghost');
            const panel = document.getElementById('readme');
            ghost.focus();
            terminalView.appendHelp(el.querySelector('#transcript'));

            function loadDirectory(path) {
              return fetch('/api/config?path=' + encodeURIComponent(path))
              .then(r => r.json())
              .then(res => {
                $ps1 = 'guest@browser:' + res.cwd + '$ ';
                terminalView.readme(panel, res);
                window.CAT_MAX = res.catMax;
                return res.cwd;
              });
            }

            window.addEventListener('popstate', (event) => {
              if (event.state?.cwd) loadDirectory(event.state.cwd).catch(() => {});
            });
            loadDirectory(initialPath).then(cwd => {
              window.history.replaceState({ cwd }, '', terminalView.pathURL(cwd) + window.location.hash);
              ghost.value = 'ls';
              ghost.dispatchEvent(new Event('input', { bubbles: true }));
              ghost.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            });
          "
        data-on-click="el.querySelector('#ghost').focus()"
        data-on-keydown="
         const k=evt.key;
         const completions = el.querySelector('#completions');
         const transcript = el.querySelector('#transcript');
         if (k !== 'Tab') {
           completions.replaceChildren();
         }
         if (k==='Enter') {
           const cmd = $current;
           terminalView.appendCommand(transcript, $ps1, cmd);
           if (cmd) { $history.push(cmd); }
           $histIndex = $history.length;
           $current = '';
           $cursorPos = 0;
           const sc = el.querySelector('.screen');
           requestAnimationFrame(()=>{ sc.scrollTop = sc.scrollHeight; });

           fetch('/api/exec', {
             method: 'POST', headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ input: cmd })
           })
           .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
             .then((res) => {
               const { output, download, cwd, clipboard, help, image, redirect } = res || {};
             if (typeof output === 'string' && output.length) {
               const clickable = /^\s*(ls|dir|tree)(\s|$)/.test(cmd);
               transcript.append(terminalView.ansiLine(output, clickable));
             }
             if (help) terminalView.appendHelp(transcript);
             if (image) terminalView.appendImage(transcript, image);
             if (download) terminalView.download(download);
              if (clipboard) {
                // Copy to clipboard
                navigator.clipboard.writeText(clipboard).catch(err => {
                  console.error('Failed to copy to clipboard:', err);
                });
              }
              const destination = typeof redirect === 'string' && redirect.startsWith('/')
                ? terminalView.sameOriginURL(terminalView.pathURL(redirect))
                : null;
              if (destination) {
                window.location.assign(destination);
                return;
              }
               if (cwd !== undefined) {
                  $ps1 = 'guest@browser:' + cwd + '$ ';
                  // Update URL and browser history when directory changes
                  const newPath = terminalView.pathURL(cwd);
                  if (window.location.pathname !== newPath) {
                    window.history.pushState({ cwd }, '', newPath);
                  }
               }
               if (res) terminalView.readme(document.getElementById('readme'), res);
               requestAnimationFrame(()=>{ sc.scrollTop = sc.scrollHeight; });
           })
           .catch(err => {
             transcript.append(terminalView.ansiLine('error: ' + String(err), false));
             requestAnimationFrame(()=>{ sc.scrollTop = sc.scrollHeight; });
           });

           evt.preventDefault();
         } else if (k==='Backspace') {
           if ($cursorPos > 0) {
             $current = $current.slice(0, $cursorPos - 1) + $current.slice($cursorPos);
             $cursorPos--;
           }
           evt.preventDefault();
         } else if (k==='Tab') {
           const m = $current.match(/^\s*(\S+)(?:\s+(.*))?$/);
           const cmd = m ? m[1] : '';
           let arg = m && m[2] !== undefined ? m[2] : '';

           // Extract the actual path argument, skipping flags (starting with -)
           let pathArg = '';
           if (arg) {
             const parts = arg.split(/\s+/);
             // Find the last non-flag argument
             for (let i = parts.length - 1; i >= 0; i--) {
               if (parts[i] && !parts[i].startsWith('-')) {
                 pathArg = parts[i];
                 break;
               }
             }
           }

           const isLs = (cmd === 'ls' || cmd === 'dir');
           const isCd = (cmd === 'cd');
           const isCat = (cmd === 'cat');
           const isGet = (cmd === 'wget' || cmd === 'get' || cmd === 'rget' || cmd === 'download');
           const isUrl = (cmd === 'url' || cmd === 'share');
           const isSum = (cmd === 'sum' || cmd === 'checksum');
           if (isLs || isCd || isCat || isGet || isUrl || isSum) {
             const body = { path: pathArg || '', dirsOnly: false, filesOnly: false, maxSize: 0, textOnly: false };
             if (isCd) { body.dirsOnly = true; }
             if (isCat) { body.filesOnly = true; body.textOnly = true; body.maxSize = (window.CAT_MAX||0); }
             if (isGet) { body.filesOnly = true; }
             if (isUrl) { body.filesOnly = true; }
             if (isSum) { body.filesOnly = true; }
             fetch('/api/complete', {
               method: 'POST', headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify(body)
             })
             .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
             .then(({ items }) => {
               if (!Array.isArray(items) || items.length === 0) {
                 completions.replaceChildren();
                 return;
               }
               const slash = (pathArg||'').lastIndexOf('/');
               const dirPart  = slash >= 0 ? pathArg.slice(0, slash+1) : '';
               const basePart = slash >= 0 ? pathArg.slice(slash+1) : (pathArg||'');
               const names = items.map(it => it.name);
               const lcp = longestCommonPrefix(names);

               // Reconstruct command with flags
               const flagsPart = arg && pathArg ? arg.substring(0, arg.lastIndexOf(pathArg)) : (arg && arg.trim().startsWith('-') ? arg + ' ' : '');

               if (lcp && lcp !== basePart) {
                 $current = cmd + ' ' + flagsPart + (dirPart + lcp);
                 $cursorPos = $current.length; // Fix cursor position
                 completions.replaceChildren();
               } else if (items.length === 1) {
                 const one = items[0];
                 $current = cmd + ' ' + flagsPart + (dirPart + one.name + (one.dir ? '/' : ''));
                 $cursorPos = $current.length; // Fix cursor position
                 completions.replaceChildren();
               } else {
                 const list = items.map(it => it.name + (it.dir ? '/' : '')).join('  ');
                 completions.textContent = list;
                 const sc = el.querySelector('.screen'); requestAnimationFrame(()=>{ sc.scrollTop = sc.scrollHeight; });
               }
             })
             .catch(()=>{});
             evt.preventDefault();
           } else {
             $current += '    ';
             evt.preventDefault();
           }
         } else if (k==='ArrowLeft' && evt.ctrlKey) {
           // Ctrl-Left: Move cursor one word left
           const before = $current.slice(0, $cursorPos);
           const match = before.match(/\S*\s*$/);
           if (match) {
             $cursorPos = Math.max(0, $cursorPos - match[0].length);
           }
           evt.preventDefault();
         } else if (k==='ArrowRight' && evt.ctrlKey) {
           // Ctrl-Right: Move cursor one word right
           const after = $current.slice($cursorPos);
           const match = after.match(/^\s*\S*/);
           if (match) {
             $cursorPos = Math.min($current.length, $cursorPos + match[0].length);
           }
           evt.preventDefault();
         } else if (k==='ArrowLeft') {
           // Move cursor left
           if ($cursorPos > 0) {
             $cursorPos--;
           }
           evt.preventDefault();
         } else if (k==='ArrowRight') {
           // Move cursor right
           if ($cursorPos < $current.length) {
             $cursorPos++;
           }
           evt.preventDefault();
         } else if (k==='ArrowUp') {
           if ($histIndex>0) { 
             $histIndex--; 
             $current = $history[$histIndex] ?? ''; 
             $cursorPos = $current.length;
           }
           evt.preventDefault();
         } else if (k==='ArrowDown') {
           if ($histIndex < $history.length) { 
             $histIndex++; 
             $current = $history[$histIndex] ?? ''; 
             $cursorPos = $current.length;
           }
           evt.preventDefault();
         } else if (k==='u' && evt.ctrlKey) {
           // Ctrl-U: Clear the current line (Unix shell behavior)
           $current = '';
           $cursorPos = 0;
           evt.preventDefault();
         } else if (k==='w' && evt.ctrlKey) {
           // Ctrl-W: Delete word backwards (Unix shell behavior)
           const before = $current.slice(0, $cursorPos);
           const after = $current.slice($cursorPos);
           const newBefore = before.replace(/\S*\s*$/, '');
           $current = newBefore + after;
           $cursorPos = newBefore.length;
           evt.preventDefault();
         } else if (k==='k' && evt.ctrlKey) {
           // Ctrl-K: Delete from cursor to end of line (Unix shell behavior)
           $current = $current.slice(0, $cursorPos);
           evt.preventDefault();
         } else if (k==='l' && evt.ctrlKey) {
           // Ctrl-L: Clear screen (Unix shell behavior)
           transcript.replaceChildren();
           evt.preventDefault();
         } else if (k==='a' && evt.ctrlKey) {
           // Ctrl-A: Move cursor to beginning of line
           $cursorPos = 0;
           evt.preventDefault();
         } else if (k==='e' && evt.ctrlKey) {
           // Ctrl-E: Move cursor to end of line  
           $cursorPos = $current.length;
           evt.preventDefault();
         }
       "
      >
        <input
          id="ghost"
          class="ghost"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
          aria-label="Hidden terminal input"
          data-on-input="
            const val = evt.target.value;
            if (val && val.charCodeAt(0) > 31) {
              $current = $current.slice(0, $cursorPos) + val + $current.slice($cursorPos);
              $cursorPos += val.length;
            }
            evt.target.value = '';
          "
        />

        <div id="screen" class="screen">
          <div id="transcript"></div>
          <div class="line"><span class="ps1" data-text="$ps1"></span><span class="input-before" data-text="$current.slice(0, $cursorPos)"></span><span class="cursor" data-text="$current[$cursorPos] || ' '"></span><span class="input-after" data-text="$current.slice($cursorPos + 1)"></span></div>
          <div id="completions" class="line out"></div>
        </div>
      </div>
      <div
        id="readme"
        class="readme"
        data-class-show="$showReadme"
      ></div>
      <button
        class="mobile-toggle"
        data-on-click="$showReadme = !$showReadme"
        data-text="$showReadme ? '✕' : '📖'"
        aria-label="Toggle README"
      ></button>
    </div>
  </body>
</html>
