# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: lsget

before:
  hooks:
    - sh scripts/vendor-js.sh check

builds:
  - id: lsget
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
    targets:
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - linux_386_sse2
      - linux_amd64_v1
      - linux_arm_6
      - linux_arm64_v8.0
      - linux_ppc64_power8
      - windows_386_sse2
      - windows_amd64_v1
      - windows_arm64_v8.0
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: binaries
    ids: [lsget]
    formats: [binary]
    name_template: >-
      lsget-{{- if eq .Os "linux" -}}Linux
             {{- else if eq .Os "darwin" -}}Darwin
             {{- else if eq .Os "windows" -}}Windows
             {{- else -}}{{ .Os }}{{- end -}}-{{- if or
        (and (eq .Os "linux") (eq .Arch "amd64"))
        (and (eq .Os "darwin") (eq .Arch "amd64"))
      -}}x86_64
      {{- else if and (eq .Os "linux") (eq .Arch "arm64") -}}aarch64
      {{- else -}}{{ .Arch }}{{- end -}}
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_checksums.txt"
  extra_files:
    - glob: assets/js/*.LICENSE.md
release:
  mode: keep-existing
  extra_files:
    - glob: assets/js/*.LICENSE.md
